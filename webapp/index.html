<!DOCTYPE html>
<html lang="en">

    <link rel="stylesheet" href="css/style.css" />

    <script

      data-sap-ui-theme="sap_fiori_3"

      data-sap-ui-resourceroots='{
        "com.inv.sapfioriwebinvertions": "./"

  <body class="sapUiBody sapUiSizeCompact" id="content">
    <div
      data-sap-ui-component
      data-name="com.inv.sapfioriwebinvertions"
      data-id="container"
      data-settings='{"id" : "com.inv.sapfioriwebinvertions"}'
